spring:
  application:
    name: meli-orders-service

  datasource:
    url: jdbc:postgresql://localhost:5432/orders_db
    username: orders
    password: orders
    hikari:
      # SOLUCAO (Bloco 1 — backpressure no banco): limitar o pool forca a aplicacao
      # a sinalizar ao cliente (via timeout) quando o banco esta sob pressao.
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 3000
      transaction-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    # SOLUCAO (Bloco 1 — observabilidade): habilitar log torna visivel
    # quantas queries o Hibernate gera por requisicao.
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        generate_statistics: false
        jdbc:
          # SOLUCAO (Bloco 2 — batch insert): agrupa ate 50 statements em uma chamada.
          # Requer SEQUENCE (nao IDENTITY) na entidade. Reduz N round-trips para N/50.
          batch_size: 50
          order_inserts: true
          order_updates: true
        default_batch_fetch_size: 50

  data:
    redis:
      host: localhost
      port: 6379

  elasticsearch:
    uris: http://localhost:9200

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

# Aula 7: Management endpoints e metricas Prometheus.
management:
  endpoints:
    web:
      exposure:
        # SOLUÇÃO: expor endpoints de observabilidade — health, metrics, prometheus.
        include: health,metrics,prometheus,env
  metrics:
    export:
      prometheus:
        # SOLUÇÃO: habilitar exportacao Prometheus.
        enabled: true
    # SOLUÇÃO: tags globais enriquecem todas as metricas.
    tags:
      app: meli-orders-service
      environment: local
    # SOLUCAO (Observabilidade — histograma de latência): habilita os buckets de histograma
    # para http.server.requests. Sem isso, histogram_quantile() no Prometheus retorna NaN
    # e os painéis de p99/p95/p50 do Grafana ficam vazios.
    distribution:
      percentiles-histogram:
        http.server.requests: true
  health:
    elasticsearch:
      enabled: false

services:
  catalog:
    url: http://localhost:8081
  # Serviço externo de Billing — simulado via WireMock em desenvolvimento local.
  # Para ambiente local (fora do docker): http://localhost:8082
  # Para ambiente docker-compose: http://billing-wiremock:8080
  # O docker-compose expõe o WireMock na porta 8082 do host.
  billing:
    url: http://localhost:8082

# SOLUÇÃO: configuracao do Resilience4j para o circuit breaker do BillingClient.
# Limites conservadores para proteger contra falhas em cascata.
resilience4j:
  circuitbreaker:
    instances:
      billing:
        # Abre o circuito apos 50% de falhas em 10 chamadas
        sliding-window-size: 10
        failure-rate-threshold: 50
        # Mantém o circuito aberto por 30s antes de tentar novamente
        wait-duration-in-open-state: 30s
        # Permite 3 chamadas de teste no estado HALF_OPEN
        permitted-number-of-calls-in-half-open-state: 3
        # Registra metrica de circuito no Actuator/Prometheus
        register-health-indicator: true
  retry:
    instances:
      billing:
        # Tenta ate 2 vezes antes de contar como falha definitiva
        max-attempts: 2
        wait-duration: 200ms

