spring:
  application:
    name: meli-orders-service

  datasource:
    url: jdbc:postgresql://localhost:5432/orders_db
    username: orders
    password: orders
    hikari:
      # SOLUCAO (Bloco 1 — backpressure no banco): limitar o pool forca a aplicacao
      # a sinalizar ao cliente (via timeout) quando o banco esta sob pressao.
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    # SOLUCAO (Bloco 1 — observabilidade): habilitar log torna visivel
    # quantas queries o Hibernate gera por requisicao.
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true

  data:
    mongodb:
      uri: mongodb://localhost:27017/orders_catalog
    redis:
      host: localhost
      port: 6379

  elasticsearch:
    uris: http://localhost:9200

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
  health:
    elasticsearch:
      enabled: false

