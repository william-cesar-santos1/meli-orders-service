version: '3.9'

# SOLUÇÃO: docker-compose.yml atualizado para aula 5 — dependencias minimas.
# MongoDB REMOVIDO definitivamente. Redpanda adicionado para eventos de dominio.
# Principio: infraestrutura como codigo — sem servicos desnecessarios no ambiente local.

services:
  meli-orders-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meli-orders-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders_db
      SPRING_DATASOURCE_USERNAME: orders
      SPRING_DATASOURCE_PASSWORD: orders
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SERVICES_BILLING_URL: http://billing-wiremock:8080
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - meli-network

  postgres:
    image: postgres:16-alpine
    container_name: meli-orders-postgres
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    command: >
      postgres
        -c wal_level=replica
        -c max_wal_senders=3
        -c wal_keep_size=64
        -c synchronous_commit=off
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-replication.sql:/docker-entrypoint-initdb.d/init-replication.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meli-network

  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: meli-orders-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - meli-network

  redis:
    image: redis:7-alpine
    container_name: meli-orders-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meli-network

  # Simulação do microserviço externo de Billing via WireMock.
  # O contexto de Billing foi extraído deste serviço — toda comunicação ocorre via HTTP,
  # com Anti-Corruption Layer (ACL) na camada de order.application.acl.
  # Para sobrescrever o comportamento padrão (CAPTURED), use a Admin API do WireMock:
  #   POST http://localhost:8082/__admin/mappings
  # ou edite os arquivos em ./wiremock/mappings/ e reinicie o container.
  billing-wiremock:
    image: wiremock/wiremock:3.3.1-1
    container_name: meli-billing-wiremock
    ports:
      - "8082:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings
      - ./wiremock/__files:/home/wiremock/__files
    command: --port 8080 --verbose
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/__admin/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meli-network

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: meli-orders-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - meli-network

  # ── Loki: backend de agregação e consulta de logs (substitui ELK para logs no Grafana).
  # Armazenamento local em filesystem — adequado para ambiente de desenvolvimento.
  # Acesso via Grafana → Explore → datasource Loki, usando LogQL.
  loki:
    image: grafana/loki:3.0.0
    container_name: meli-orders-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - meli-network

  # ── Promtail: agente coletor que lê os logs dos containers via Docker socket.
  # Descobre containers automaticamente, aplica pipeline JSON para extrair
  # campos estruturados (level, logger_name) como labels Loki indexáveis.
  promtail:
    image: grafana/promtail:3.0.0
    container_name: meli-orders-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Docker socket: permite descoberta automática de containers.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - meli-network

  grafana:
    image: grafana/grafana:10.4.2
    container_name: meli-orders-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki
    networks:
      - meli-network

volumes:
  postgres_data:
  loki_data:

# Rede explícita compartilhada por todos os serviços.
# Garante resolução DNS consistente (ex: "loki", "prometheus") independente
# da ordem de inicialização ou rebuilds parciais.
networks:
  meli-network:
    driver: bridge
