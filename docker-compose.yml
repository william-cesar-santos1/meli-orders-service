version: '3.9'

# SOLUÇÃO: docker-compose.yml atualizado para aula 5 — dependencias minimas.
# MongoDB REMOVIDO definitivamente. Redpanda adicionado para eventos de dominio.
# Principio: infraestrutura como codigo — sem servicos desnecessarios no ambiente local.

services:
  postgres:
    image: postgres:16-alpine
    container_name: meli-orders-postgres
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    command: >
      postgres
        -c wal_level=replica
        -c max_wal_senders=3
        -c wal_keep_size=64
        -c synchronous_commit=off
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-replication.sql:/docker-entrypoint-initdb.d/init-replication.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SOLUÇÃO: Redpanda — broker Kafka-compatible leve para eventos de dominio (Saga, Outbox).
  # Substitui qualquer necessidade de MongoDB para log de eventos.
  # Kafka-compatible: producers/consumers Kafka funcionam sem mudanca.
  redpanda:
    image: redpandadata/redpanda:v23.3.18
    container_name: meli-orders-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
    ports:
      - "19092:19092"
      - "18082:18082"
      - "18081:18081"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: meli-orders-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: meli-orders-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Simulação do microserviço externo de Billing via WireMock.
  # O contexto de Billing foi extraído deste serviço — toda comunicação ocorre via HTTP,
  # com Anti-Corruption Layer (ACL) na camada de order.application.acl.
  # Para sobrescrever o comportamento padrão (CAPTURED), use a Admin API do WireMock:
  #   POST http://localhost:8082/__admin/mappings
  # ou edite os arquivos em ./wiremock/mappings/ e reinicie o container.
  billing-wiremock:
    image: wiremock/wiremock:3.3.1-1
    container_name: meli-billing-wiremock
    ports:
      - "8082:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings
      - ./wiremock/__files:/home/wiremock/__files
    command: --port 8080 --verbose
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/__admin/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: meli-orders-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:10.4.2
    container_name: meli-orders-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  postgres_data:
