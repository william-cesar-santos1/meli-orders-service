version: '3.9'

# SOLUCAO: docker-compose com stack minima + proxy reverso para replicas da app.
services:
  meli-orders-app:
    profiles:
      - prd
    build:
      context: .
      dockerfile: Dockerfile
    # Sem container_name e sem publish de porta para permitir escalabilidade.
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders_db
      SPRING_DATASOURCE_USERNAME: orders
      SPRING_DATASOURCE_PASSWORD: orders
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SERVICES_BILLING_URL: http://billing-wiremock:8080
      # OpenTelemetry: exporta traces via OTLP gRPC para Jaeger
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    deploy:
      replicas: 3

  nginx:
    profiles:
      - prd
    image: nginx:1.27-alpine
    container_name: meli-orders-nginx
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx-reverse.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - meli-orders-app

  postgres:
    image: postgres:16-alpine
    container_name: meli-orders-postgres
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    command: >
      postgres
        -c wal_level=replica
        -c max_wal_senders=3
        -c wal_keep_size=64
        -c synchronous_commit=off
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-replication.sql:/docker-entrypoint-initdb.d/init-replication.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meli-network

  redis:
    image: redis:7-alpine
    container_name: meli-orders-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meli-network

  # Simulacao do microservico externo de Billing via WireMock.
  billing-wiremock:
    image: wiremock/wiremock:3.3.1-1
    container_name: meli-billing-wiremock
    ports:
      - "8082:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings
      - ./wiremock/__files:/home/wiremock/__files
    command: --port 8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/__admin/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meli-network

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: meli-orders-prometheus
    # SOLUCAO: o docker_sd_configs precisa ler o socket do Docker (/var/run/docker.sock).
    # O container do Prometheus roda por padrao como nobody (uid 65534), que nao tem
    # permissao no socket. Rodar como root (uid 0) resolve o "permission denied".
    user: "0"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - meli-network

  # ── Loki: backend de agregação e consulta de logs (substitui ELK para logs no Grafana).
  # Armazenamento local em filesystem — adequado para ambiente de desenvolvimento.
  # Acesso via Grafana → Explore → datasource Loki, usando LogQL.
  loki:
    image: grafana/loki:3.0.0
    container_name: meli-orders-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - meli-network

  # ── Promtail: agente coletor que lê os logs dos containers via Docker socket.
  # Descobre containers automaticamente, aplica pipeline JSON para extrair
  # campos estruturados (level, logger_name) como labels Loki indexáveis.
  promtail:
    image: grafana/promtail:3.0.0
    container_name: meli-orders-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Docker socket: permite descoberta automática de containers.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - meli-network

  grafana:
    image: grafana/grafana:10.4.2
    container_name: meli-orders-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki
    networks:
      - meli-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: meli-orders-jaeger
    ports:
      - "6831:6831/udp"
      - "16686:16686"
      - "14317:4317"
      - "14318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

volumes:
  postgres_data:
  loki_data:

# Rede explícita compartilhada por todos os serviços.
# Garante resolução DNS consistente (ex: "loki", "prometheus") independente
# da ordem de inicialização ou rebuilds parciais.
networks:
  meli-network:
    driver: bridge
